name: Mobile distributions (experimental)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-distributions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libz-dev zlib1g-dev libgtk-3-dev libxtst-dev xvfb xauth unzip
      - name: Set up pinned Gluon and Android tools
        shell: bash
        run: |
          bash scripts/setup-mobile-tools.sh
          source .cache/mobile-tools/env.sh
          bash scripts/setup-mobile-android.sh
      - name: Verify shared Java, FXML, SQLite and PDF on the host JVM
        shell: bash
        run: |
          set -euo pipefail
          source .cache/mobile-tools/env.sh
          python3 mobile/prepare.py
          xvfb-run -a mvn -B -ntp -f mobile/pom.xml verify
      - name: Verify statically linked SQLite JNI on the host
        shell: bash
        run: |
          set -euo pipefail
          source .cache/mobile-tools/env.sh
          mkdir -p mobile/target/logs
          bash scripts/test-mobile-native-sqlite.sh 2>&1 | tee mobile/target/logs/native-jni-test.log
      - name: Compile and package native Android application
        shell: bash
        run: |
          source .cache/mobile-tools/env.sh
          source .cache/mobile-tools/android-env.sh
          bash scripts/build-mobile.sh android
      - name: Verify actual APK signature
        shell: bash
        run: |
          source .cache/mobile-tools/android-env.sh
          "$ANDROID_SDK/build-tools/34.0.0/apksigner" verify --verbose dist/android/Kharchiche-Konsolidated-1.0.0.apk
      - name: Upload generated APK
        uses: actions/upload-artifact@v4
        with:
          name: kharchiche-android-arm64
          path: dist/android/Kharchiche-Konsolidated-1.0.0.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-android
          path: |
            mobile/target/logs/
            mobile/target/gluonfx/**/log/
            mobile/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  ios:
    name: iOS ARM64 (optional Apple signing)
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      MOBILE_IOS_SIGNING_IDENTITY: ${{ secrets.MOBILE_IOS_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select pinned Xcode
        run: |
          test -d /Applications/Xcode_16.4.app
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Set up pinned Gluon tools
        run: bash scripts/setup-mobile-tools.sh
      - name: Prepare optional Apple signing
        id: signing
        env:
          MOBILE_IOS_CERTIFICATE_P12_BASE64: ${{ secrets.MOBILE_IOS_CERTIFICATE_P12_BASE64 }}
          MOBILE_IOS_CERTIFICATE_PASSWORD: ${{ secrets.MOBILE_IOS_CERTIFICATE_PASSWORD }}
          MOBILE_IOS_PROVISION_PROFILE_BASE64: ${{ secrets.MOBILE_IOS_PROVISION_PROFILE_BASE64 }}
        run: bash scripts/mobile-ios-signing.sh prepare
      - name: Compile and package native iOS application
        shell: bash
        run: |
          source .cache/mobile-tools/env.sh
          bash scripts/build-mobile.sh ios
      - name: Upload signed IPA
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kharchiche-ios-arm64
          path: dist/ios/Kharchiche-Konsolidated-1.0.0.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload unsigned iOS app (not installable on iPhone)
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kharchiche-ios-arm64-unsigned
          path: mobile/target/artifacts/Kharchiche-Konsolidated-ios-unsigned.app.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload iOS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-ios
          path: |
            mobile/target/logs/
            mobile/target/gluonfx/**/log/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove temporary Apple signing material
        if: always()
        run: bash scripts/mobile-ios-signing.sh cleanup
