
name: Mobile distributions (experimental)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-distributions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Linux build prerequisites
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail

          echo "Checking Ubuntu environment..."
          cat /etc/os-release

          echo "Checking required build tools..."
          required_commands=(
            cc
            ar
            make
            curl
            unzip
            python3
            mvn
            xvfb-run
            xauth
          )

          for command in "${required_commands[@]}"; do
            if ! command -v "$command" >/dev/null 2>&1; then
              echo "::error::Missing required command: $command"
              exit 1
            fi
            echo "OK: $command"
          done

          echo "Checking zlib headers..."
          if [[ ! -f /usr/include/zlib.h ]]; then
            echo "::error::Missing zlib development headers"
            exit 1
          fi

          echo "Checking JavaFX runtime libraries..."
          ldconfig -p > /tmp/mobile-linux-libraries.txt
          for library in libgtk-3.so.0 libXtst.so.6; do
            if ! grep -Fq "$library" /tmp/mobile-linux-libraries.txt; then
              echo "::error::Missing runtime library: $library"
              exit 1
            fi
            echo "OK: $library"
          done

          echo "Linux prerequisites verified successfully."

      - name: Set up pinned Gluon and Android tools
        shell: bash
        run: |
          set -euo pipefail

          bash scripts/setup-mobile-tools.sh
          source .cache/mobile-tools/env.sh
          bash scripts/setup-mobile-android.sh

      - name: Verify shared Java, FXML, SQLite and PDF on the host JVM
        shell: bash
        run: |
          set -euo pipefail

          source .cache/mobile-tools/env.sh
          python3 mobile/prepare.py
          xvfb-run -a mvn -B -ntp -f mobile/pom.xml verify

      - name: Verify statically linked SQLite JNI on the host
        shell: bash
        run: |
          set -euo pipefail

          source .cache/mobile-tools/env.sh
          mkdir -p mobile/target/logs

          bash scripts/test-mobile-native-sqlite.sh \
            2>&1 | tee mobile/target/logs/native-jni-test.log

      - name: Compile and package native Android application
        shell: bash
        run: |
          set -euo pipefail

          source .cache/mobile-tools/env.sh
          source .cache/mobile-tools/android-env.sh

          bash scripts/build-mobile.sh android

      - name: Verify actual APK signature
        shell: bash
        run: |
          set -euo pipefail

          source .cache/mobile-tools/android-env.sh

          APK="dist/android/Kharchiche-Konsolidated-1.0.0.apk"

          test -s "$APK"

          "$ANDROID_SDK/build-tools/34.0.0/apksigner" \
            verify --verbose "$APK"

          sha256sum "$APK" > "$APK.sha256"

      - name: Upload generated APK
        uses: actions/upload-artifact@v4
        with:
          name: kharchiche-android-arm64
          path: |
            dist/android/Kharchiche-Konsolidated-1.0.0.apk
            dist/android/Kharchiche-Konsolidated-1.0.0.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-android
          path: |
            mobile/target/logs/
            mobile/target/gluonfx/**/log/
            mobile/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  ios:
    name: iOS ARM64 (optional Apple signing)
    runs-on: macos-15-intel
    timeout-minutes: 90

    outputs:
      signed: ${{ steps.signing.outputs.signed }}

    env:
      MOBILE_IOS_SIGNING_IDENTITY: ${{ secrets.MOBILE_IOS_SIGNING_IDENTITY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Select pinned Xcode
        shell: bash
        run: |
          set -euo pipefail

          test -d /Applications/Xcode_16.4.app

          sudo xcode-select --switch \
            /Applications/Xcode_16.4.app/Contents/Developer

          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up pinned Gluon tools
        shell: bash
        run: |
          set -euo pipefail

          bash scripts/setup-mobile-tools.sh

      - name: Prepare optional Apple signing
        id: signing
        shell: bash
        env:
          MOBILE_IOS_CERTIFICATE_P12_BASE64: ${{ secrets.MOBILE_IOS_CERTIFICATE_P12_BASE64 }}
          MOBILE_IOS_CERTIFICATE_PASSWORD: ${{ secrets.MOBILE_IOS_CERTIFICATE_PASSWORD }}
          MOBILE_IOS_PROVISION_PROFILE_BASE64: ${{ secrets.MOBILE_IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          bash scripts/mobile-ios-signing.sh prepare

      - name: Compile and package native iOS application
        shell: bash
        run: |
          set -euo pipefail

          source .cache/mobile-tools/env.sh

          bash scripts/build-mobile.sh ios

      - name: Record verified signed IPA checksum
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          IPA="dist/ios/Kharchiche-Konsolidated-1.0.0.ipa"

          test -s "$IPA"
          shasum -a 256 "$IPA" > "$IPA.sha256"

      - name: Upload signed IPA
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kharchiche-ios-arm64
          path: |
            dist/ios/Kharchiche-Konsolidated-1.0.0.ipa
            dist/ios/Kharchiche-Konsolidated-1.0.0.ipa.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload unsigned iOS app (not installable on iPhone)
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kharchiche-ios-arm64-unsigned
          path: mobile/target/artifacts/Kharchiche-Konsolidated-ios-unsigned.app.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload iOS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-ios
          path: |
            mobile/target/logs/
            mobile/target/gluonfx/**/log/
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove temporary Apple signing material
        if: always()
        shell: bash
        run: |
          bash scripts/mobile-ios-signing.sh cleanup

  publish-mobile:
    name: Publish verified mobile distributions to main

    needs: [android, ios]

    if: >-
      ${{
        always() &&
        !cancelled() &&
        github.ref == 'refs/heads/main' &&
        (
          needs.android.result == 'success' ||
          (
            needs.ios.result == 'success' &&
            needs.ios.outputs.signed == 'true'
          )
        )
      }}

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: write

    concurrency:
      group: distribution-publication-main
      cancel-in-progress: false

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: false
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download verified Android artifact from this run
        if: needs.android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: kharchiche-android-arm64
          path: target/mobile-publication/android

      - name: Download verified signed iOS artifact from this run
        if: needs.ios.result == 'success' && needs.ios.outputs.signed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: kharchiche-ios-arm64
          path: target/mobile-publication/ios

      - name: Test Android publication replacement safety
        if: needs.android.result == 'success'
        env:
          APK_ARTIFACT_PATH: ${{ github.workspace }}/target/mobile-publication/android/Kharchiche-Konsolidated-1.0.0.apk
        run: |
          python3 -m unittest discover \
            -s mobile \
            -p 'test_stage_publication.py'

      - name: Validate and stage Android replacement
        if: needs.android.result == 'success'
        run: |
          python3 mobile/stage-publication.py \
            android target/mobile-publication/android .

      - name: Validate and stage signed iOS replacement
        if: needs.ios.result == 'success' && needs.ios.outputs.signed == 'true'
        run: |
          python3 mobile/stage-publication.py \
            ios target/mobile-publication/ios .

      - name: Commit only successful mobile replacements
        env:
          PUBLISH_ANDROID: ${{ needs.android.result == 'success' }}
          PUBLISH_IOS: ${{ needs.ios.result == 'success' && needs.ios.outputs.signed == 'true' }}
        run: |
          bash scripts/publish-mobile.sh
