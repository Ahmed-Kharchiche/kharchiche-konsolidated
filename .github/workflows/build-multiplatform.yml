
name: Native distributions

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.platform }}-${{ matrix.arch }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows
            arch: x64
            jdk_arch: x64

          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            jdk_arch: x64

          - runner: macos-15
            platform: macos
            arch: arm64
            jdk_arch: aarch64

          - runner: macos-15-intel
            platform: macos
            arch: x64
            jdk_arch: x64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: ${{ matrix.jdk_arch }}
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # WINDOWS

      - name: Build and test Windows
        if: matrix.platform == 'windows'
        shell: cmd
        run: call build-windows.bat

      - name: Archive Windows application
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "target/native-artifacts" | Out-Null

          Compress-Archive `
            -Path "dist/Kharchiche Konsolidated" `
            -DestinationPath "target/native-artifacts/Kharchiche-Konsolidated-windows-x64.zip" `
            -Force

      - name: Windows package artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: kharchiche-windows-x64
          path: target/native-artifacts/Kharchiche-Konsolidated-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # LINUX

      - name: Linux prerequisites
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fakeroot \
            dpkg-dev \
            xvfb \
            xauth \
            libgtk-3-0t64 \
            libasound2t64

      - name: Build and test Linux
        if: matrix.platform == 'linux'
        run: xvfb-run -a bash scripts/build-linux.sh

      - name: Linux package artifact
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: kharchiche-linux-x64
          path: dist/linux/*.deb
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # MACOS

      - name: Build and test macOS
        if: matrix.platform == 'macos'
        run: bash scripts/build-macos.sh

      - name: Archive macOS application
        if: matrix.platform == 'macos'
        run: |
          mkdir -p target/native-artifacts

          ditto -c -k --sequesterRsrc --keepParent \
            "dist/macos/${{ matrix.arch }}/Kharchiche Konsolidated.app" \
            "target/native-artifacts/Kharchiche-Konsolidated-${{ matrix.arch }}.app.zip"

      - name: macOS artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: kharchiche-macos-${{ matrix.arch }}
          path: |
            dist/macos/${{ matrix.arch }}/*.dmg
            target/native-artifacts/*.app.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # DIAGNOSTIC LOGS

      - name: Diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            target/native-logs/
            target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
