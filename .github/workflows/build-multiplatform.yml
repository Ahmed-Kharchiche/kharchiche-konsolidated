
name: Native distributions

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-distributions-main
  cancel-in-progress: false

jobs:
  native:
    name: ${{ matrix.platform }}-${{ matrix.arch }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows
            arch: x64
            jdk_arch: x64

          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            jdk_arch: x64

          - runner: macos-15
            platform: macos
            arch: arm64
            jdk_arch: aarch64

          - runner: macos-15-intel
            platform: macos
            arch: x64
            jdk_arch: x64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false

      # CLEAN DISTRIBUTIONS BEFORE BUILD

      - name: Clean old distributions on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (Test-Path "dist") {
            Remove-Item "dist" -Recurse -Force
          }

      - name: Clean old distributions on Unix
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          rm -rf dist

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: ${{ matrix.jdk_arch }}
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # WINDOWS

      - name: Set up WiX Toolset 3
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install wixtoolset --version=3.14.1 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed.' }
          $wix = Get-ChildItem "${env:ProgramFiles(x86)}/WiX Toolset v3*/bin/candle.exe" |
            Select-Object -First 1
          if (!$wix) { throw 'WiX Toolset 3 not found.' }
          $wix.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build and test Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Create Windows installer and portable archive
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - name: Windows package artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: kharchiche-windows-x64
          path: |
            dist/windows/Kharchiche-Konsolidated-Setup.exe
            dist/windows/Kharchiche-Konsolidated-Portable.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # LINUX

      - name: Linux prerequisites
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fakeroot \
            dpkg-dev \
            xvfb \
            xauth \
            libgtk-3-0t64 \
            libasound2t64

      - name: Build and test Linux
        if: matrix.platform == 'linux'
        run: xvfb-run -a bash scripts/build-linux.sh

      - name: Linux package artifact
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: kharchiche-linux-x64
          path: dist/linux/*.deb
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # MACOS

      - name: Build and test macOS
        if: matrix.platform == 'macos'
        run: bash scripts/build-macos.sh

      - name: Archive macOS application
        if: matrix.platform == 'macos'
        run: |
          mkdir -p target/native-artifacts

          ditto -c -k --sequesterRsrc --keepParent \
            "dist/macos/${{ matrix.arch }}/Kharchiche Konsolidated.app" \
            "target/native-artifacts/Kharchiche-Konsolidated-${{ matrix.arch }}.app.zip"

      - name: macOS artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: kharchiche-macos-${{ matrix.arch }}
          path: |
            dist/macos/${{ matrix.arch }}/*.dmg
            target/native-artifacts/*.app.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # DIAGNOSTIC LOGS

      - name: Diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            target/windows-build-logs/
            target/native-logs/
            target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  # PUBLISH DISTRIBUTIONS TO REPOSITORY

  publish-dist:
    name: Publish distributions to repository
    needs: native
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          lfs: false

      - name: Clean old distributions
        run: |
          git rm -r -f --ignore-unmatch dist
          rm -rf dist
          mkdir -p dist

      - name: Download Windows distribution
        uses: actions/download-artifact@v4
        with:
          name: kharchiche-windows-x64
          path: dist/windows

      - name: Restore Windows application image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/build
          unzip -q dist/windows/Kharchiche-Konsolidated-Portable.zip -d dist/build
          test -f "dist/windows/Kharchiche-Konsolidated-Setup.exe"
          test -f "dist/build/Kharchiche Konsolidated/Kharchiche Konsolidated.exe"
          test -d "dist/build/Kharchiche Konsolidated/app"
          test -d "dist/build/Kharchiche Konsolidated/runtime"

      - name: Download Linux distribution
        uses: actions/download-artifact@v4
        with:
          name: kharchiche-linux-x64
          path: dist/linux

      - name: Download macOS ARM64 distribution
        uses: actions/download-artifact@v4
        with:
          name: kharchiche-macos-arm64
          path: temp/macos/arm64

      - name: Download macOS Intel distribution
        uses: actions/download-artifact@v4
        with:
          name: kharchiche-macos-x64
          path: temp/macos/x64

      - name: Organize macOS distributions
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist/macos/arm64 dist/macos/x64

          for arch in arm64 x64; do
            find "temp/macos/$arch" -type f \
              \( -name '*.dmg' -o -name '*.app.zip' \) \
              -exec mv -t "dist/macos/$arch" {} +

            test -n "$(find "dist/macos/$arch" -maxdepth 1 -name '*.dmg' -print -quit)"
            test -n "$(find "dist/macos/$arch" -maxdepth 1 -name '*.app.zip' -print -quit)"
          done

          rm -rf temp

          echo "Final distribution structure:"
          find dist -type f

      - name: Configure Git LFS
        run: |
          git lfs install --local

          git lfs track "dist/**/*.zip"
          git lfs track "dist/**/*.dmg"
          git lfs track "dist/**/*.deb"
          git lfs track "dist/**/*.exe"
          git lfs track "dist/build/**"

      - name: Commit and push distributions
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .gitattributes
          git add -f -A dist

          if git diff --cached --quiet; then
            echo "No distribution changes."
            exit 0
          fi

          git commit -m "chore(dist): actualisation automatique des distributions"
          git push origin HEAD:main
