
name: Native distributions

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-distributions-main
  cancel-in-progress: false

jobs:
  native:
    name: ${{ matrix.platform }}-${{ matrix.arch }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows
            arch: x64
            jdk_arch: x64

          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            jdk_arch: x64

          - runner: macos-15
            platform: macos
            arch: arm64
            jdk_arch: aarch64

          - runner: macos-15-intel
            platform: macos
            arch: x64
            jdk_arch: x64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: ${{ matrix.jdk_arch }}
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # WINDOWS

      - name: Build and test Windows
        if: matrix.platform == 'windows'
        shell: cmd
        run: call build-windows.bat

      - name: Archive Windows application
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "target/native-artifacts" | Out-Null

          Compress-Archive `
            -Path "dist/Kharchiche Konsolidated" `
            -DestinationPath "target/native-artifacts/Kharchiche-Konsolidated-windows-x64.zip" `
            -Force

      - name: Windows package artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: kharchiche-windows-x64
          path: target/native-artifacts/Kharchiche-Konsolidated-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # LINUX

      - name: Linux prerequisites
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fakeroot \
            dpkg-dev \
            xvfb \
            xauth \
            libgtk-3-0t64 \
            libasound2t64

      - name: Build and test Linux
        if: matrix.platform == 'linux'
        run: xvfb-run -a bash scripts/build-linux.sh

      - name: Linux package artifact
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: kharchiche-linux-x64
          path: dist/linux/*.deb
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # MACOS

      - name: Build and test macOS
        if: matrix.platform == 'macos'
        run: bash scripts/build-macos.sh

      - name: Archive macOS application
        if: matrix.platform == 'macos'
        run: |
          mkdir -p target/native-artifacts

          ditto -c -k --sequesterRsrc --keepParent \
            "dist/macos/${{ matrix.arch }}/Kharchiche Konsolidated.app" \
            "target/native-artifacts/Kharchiche-Konsolidated-${{ matrix.arch }}.app.zip"

      - name: macOS artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: kharchiche-macos-${{ matrix.arch }}
          path: |
            dist/macos/${{ matrix.arch }}/*.dmg
            target/native-artifacts/*.app.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # DIAGNOSTIC LOGS

      - name: Diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            target/native-logs/
            target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  # PUBLICATION AUTOMATIQUE DANS DIST/

  publish-dist:
    name: Publish distributions to repository
    needs: native
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          lfs: true

      - name: Clean old distributions
        run: |
          git rm -r -f --ignore-unmatch dist
          rm -rf dist
          mkdir -p dist

      - name: Download Windows distribution
        uses: actions/download-artifact@v4
        with:
          name: kharchiche-windows-x64
          path: dist/windows

      - name: Download Linux distribution
        uses: actions/download-artifact@v4
        with:
          name: kharchiche-linux-x64
          path: dist/linux

      - name: Download macOS ARM64 distribution
        uses: actions/download-artifact@v4
        with:
          name: kharchiche-macos-arm64
          path: temp/macos/arm64

      - name: Download macOS Intel distribution
        uses: actions/download-artifact@v4
        with:
          name: kharchiche-macos-x64
          path: temp/macos/x64

      - name: Organize macOS distributions
        run: |
          mkdir -p dist/macos/arm64 dist/macos/x64

          find temp/macos/arm64 -type f \
            \( -name '*.dmg' -o -name '*.app.zip' \) \
            -exec mv -t dist/macos/arm64 {} +

          find temp/macos/x64 -type f \
            \( -name '*.dmg' -o -name '*.app.zip' \) \
            -exec mv -t dist/macos/x64 {} +

          rm -rf temp

          echo "Final distribution structure:"
          find dist -type f

      - name: Configure Git LFS
        run: |
          git lfs install --local

          git lfs track "dist/**/*.zip"
          git lfs track "dist/**/*.dmg"
          git lfs track "dist/**/*.deb"

      - name: Commit and push distributions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .gitattributes
          git add -f -A dist

          if git diff --cached --quiet; then
            echo "No distribution changes."
            exit 0
          fi

          git commit -m "chore(dist): actualisation automatique des distributions"
          git push origin HEAD:main
